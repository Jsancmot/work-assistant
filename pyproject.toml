[project]
name = "work-assistant"
version = "0.1.0"
description = "AI-powered work assistant with Telegram interface"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.5.17",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.1.0",
    "langsmith>=0.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "nest-asyncio>=0.23.0",
    "sqlalchemy>=2.0",
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "notion-client>=3.0.0",
    "python-telegram-bot[webhooks]>=21.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]