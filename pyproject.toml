[project]
name = "work-assistant"
version = "0.1.0"
description = "AI-powered work assistant with Telegram interface"
requires-python = ">=3.12"
dependencies = [
    "agno>=1.4.0",
    "groq>=0.9.0",
    "mcp>=1.0.0",
    "python-telegram-bot[webhooks]>=21.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]